name: Hugging Face export check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install tqdm pyarrow

      - name: Run unit tests
        run: python -m unittest discover -s test

      - name: Verify Hugging Face export matches the Brat source
        run: python scripts/export_huggingface.py --check
